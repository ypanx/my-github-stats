<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200"
     viewBox="0 0 480 200" role="img" aria-label="John Pan: 599 pull requests opened, 477 commits, 254,625 lines changed, 895 reviews given, between 2025-08-10 and 2026-08-09.">
  <title>John Pan: 599 pull requests opened, 477 commits, 254,625 lines changed, 895 reviews given, between 2025-08-10 and 2026-08-09.</title>

  <!-- Base styles are dark and a light-preference query overrides them, so a
       viewer expressing no preference, or a renderer ignoring the query, gets
       dark. That is the intended look rather than a fallback. -->
  <style>
    .card    { fill: #0d1117; stroke: #30363d; }
    .title   { fill: #e6edf3; font-weight: 600; font-size: 14px; }
    .window  { fill: #8b949e; font-size: 11px; }
    .column  { fill: #8b949e; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; }
    .label   { fill: #c9d1d9; font-size: 12px; }
    .value   { fill: #e6edf3; font-size: 12px; font-weight: 600; }
    .divider { stroke: #30363d; }
    .icon      { fill: none; stroke: #8b949e; stroke-width: 1.4;
                 stroke-linecap: round; stroke-linejoin: round; }
    .icon-fill { fill: #8b949e; stroke: none; }

    @media (prefers-color-scheme: light) {
      .card    { fill: #ffffff; stroke: #d0d7de; }
      .title   { fill: #1f2328; }
      .window  { fill: #656d76; }
      .column  { fill: #656d76; }
      .label   { fill: #424a53; }
      .value   { fill: #1f2328; }
      .divider { stroke: #d0d7de; }
      .icon      { stroke: #656d76; }
      .icon-fill { fill: #656d76; }
    }

    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica,
                        Arial, sans-serif; }
  </style>

  <!-- Drawn rather than set as Unicode glyphs. An SVG served through GitHub's
       image proxy renders in whatever fonts the viewer has, and the obvious
       glyphs for these are not in common system fonts. -->
  <defs>
    <g id="icon-opened" class="icon"><path d="M6 1.5 10.5 6 6 10.5 1.5 6Z"/></g>
    <g id="icon-merged" class="icon"><path d="M2.5 6.5 5 9l4.5-5"/></g>
    <g id="icon-commits" class="icon">
      <circle cx="6" cy="6" r="2.5"/><path d="M0.5 6h3M8.5 6h3"/>
    </g>
    <g id="icon-lines" class="icon"><path d="M6 1.5v5M3.5 4h5M2.5 10h7"/></g>
    <g id="icon-cycle" class="icon">
      <circle cx="6" cy="6" r="4.5"/><path d="M6 3.5V6l2 1.5"/>
    </g>
    <g id="icon-reviews" class="icon">
      <circle cx="6" cy="6" r="4.5"/><circle cx="6" cy="6" r="1.8" class="icon-fill"/>
    </g>
    <g id="icon-comments" class="icon">
      <path d="M10.5 3.5v4A1.5 1.5 0 0 1 9 9H6l-2.5 2V9H3A1.5 1.5 0 0 1 1.5 7.5v-4A1.5 1.5 0 0 1 3 2h6a1.5 1.5 0 0 1 1.5 1.5Z"/>
    </g>
  </defs>

  <rect class="card" x="0.5" y="0.5" width="479" height="199" rx="6"/>

  <text class="title" x="20" y="30">John Pan · Activity</text>
  <text class="window" x="460" y="30" text-anchor="end">2025-08-10 to 2026-08-09</text>

  <line class="divider" x1="240" y1="48" x2="240" y2="184"/>
  <text class="column" x="20" y="62">AUTHORING</text>
  <text class="column" x="260" y="62">REVIEWING</text>

  <use href="#icon-opened" x="20" y="76"/>
  <text class="label" x="42" y="86">opened</text>
  <text class="value" x="222" y="86" text-anchor="end">599</text>
  <use href="#icon-merged" x="20" y="99"/>
  <text class="label" x="56" y="109">merged</text>
  <text class="value" x="222" y="109" text-anchor="end">471</text>
  <use href="#icon-commits" x="20" y="122"/>
  <text class="label" x="42" y="132">commits</text>
  <text class="value" x="222" y="132" text-anchor="end">477</text>
  <use href="#icon-lines" x="20" y="145"/>
  <text class="label" x="42" y="155">lines</text>
  <text class="value" x="222" y="155" text-anchor="end">254,625</text>
  <use href="#icon-cycle" x="20" y="168"/>
  <text class="label" x="42" y="178">to merge</text>
  <text class="value" x="222" y="178" text-anchor="end">10.1h</text>
  <use href="#icon-reviews" x="260" y="76"/>
  <text class="label" x="282" y="86">reviews given</text>
  <text class="value" x="460" y="86" text-anchor="end">895</text>
  <use href="#icon-merged" x="260" y="99"/>
  <text class="label" x="296" y="109">approved</text>
  <text class="value" x="460" y="109" text-anchor="end">612</text>
  <use href="#icon-comments" x="260" y="122"/>
  <text class="label" x="282" y="132">comments</text>
  <text class="value" x="460" y="132" text-anchor="end">914</text>
  <use href="#icon-comments" x="260" y="145"/>
  <text class="label" x="296" y="155">inline</text>
  <text class="value" x="460" y="155" text-anchor="end">650</text>
</svg>
