    .s0 { fill: #3572A5; }
    .s1 { fill: #00ADD8; }
    .s2 { fill: #0B56DB; }
    .s3 { fill: #3178C6; }
    .s4 { fill: #CB171E; }
    .s5 { fill: #89E051; }
    .s6 { fill: #76D275; }
    .s7 { fill: #E34C26; }
    .s8 { fill: #6E7681; }

    @media (prefers-color-scheme: light) {
      .s0 { fill: #3572A5; }
      .s1 { fill: #00A1C9; }
      .s2 { fill: #083FA1; }
