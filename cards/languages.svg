<svg xmlns="http://www.w3.org/2000/svg" width="480" height="200"
     viewBox="0 0 480 200" role="img" aria-label="Languages by lines changed, 254,625 in total: Python 63.1%, Go 19.9%, Markdown 9.1%, TypeScript 3.3%, YAML 3.3%, Shell 0.5%, Bazel 0.4%, HTML 0.3%, + 4 smaller 0.2%.">
  <title>Languages by lines changed, 254,625 in total: Python 63.1%, Go 19.9%, Markdown 9.1%, TypeScript 3.3%, YAML 3.3%, Shell 0.5%, Bazel 0.4%, HTML 0.3%, + 4 smaller 0.2%.</title>

  <style>
