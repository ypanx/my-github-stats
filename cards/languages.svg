    .name   { fill: #c9d1d9; font-size: 11px; }
    .share  { fill: #8b949e; font-size: 11px; }
    .track  { fill: #21262d; }

    @media (prefers-color-scheme: light) {
      .card   { fill: #ffffff; stroke: #d0d7de; }
